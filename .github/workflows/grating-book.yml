name: Grating Physics pilot
on:
  push:
    branches: [main]
    paths:
      - 'Optics/Grating_Physics/**'
      - '.github/workflows/grating-book.yml'
      - '.binder/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: Optics/Grating_Physics
    env:
      BASE_URL: /${{ github.event.repository.name }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Install tested notebook and book dependencies
        run: python -m pip install -r book/requirements-tested.txt
      - name: Execute configured book notebooks
        run: python book/pilot.py execute
      - name: Check solution families and widget callbacks
        run: python book/check_solutions.py
      - name: Build public pilot and scan for local credentials
        run: |
          python book/pilot.py build
          python book/check_build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Optics/Grating_Physics/_build/public-pilot/_build/html
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          endpoint = (os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
                      + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts')
          request = urllib.request.Request(endpoint, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json'})
          for attempt in range(12):
              with urllib.request.urlopen(request, timeout=20) as response:
                  artifacts = json.load(response)['artifacts']
              if any(a['name'] == 'github-pages' and not a['expired'] for a in artifacts):
                  print('Pages artifact metadata is available.')
                  break
              print('Waiting for Pages artifact metadata...', flush=True)
              time.sleep(5)
          else:
              raise SystemExit('Uploaded Pages artifact is not visible yet; retry the workflow.')
          PY
      - name: Deploy pilot
        id: deployment
        uses: actions/deploy-pages@v4
