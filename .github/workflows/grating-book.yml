name: Grating Physics editions
on:
  push:
    branches: [main]
    paths:
      - 'Optics/Grating_Physics/**'
      - '.github/workflows/grating-book.yml'
      - '.binder/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'Optics/Grating_Physics/**'
      - '.github/workflows/grating-book.yml'
      - '.binder/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grating-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: Optics/Grating_Physics
    env:
      BASE_URL: /${{ github.event.repository.name }}
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Optics/Grating_Physics/book/requirements-tested.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - name: Install tested notebook and book dependencies
        run: python -m pip install -r book/requirements-tested.txt
      - name: Identify execution inputs
        id: inputs
        run: echo "key=$(python book/execution_cache.py key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: Optics/Grating_Physics/_build/executed
          key: grating-executed-v2-${{ runner.os }}-${{ steps.inputs.outputs.key }}
      - uses: actions/cache@v4
        with:
          path: Optics/Grating_Physics/_build/pyodide-runtime
          key: grating-runtime-v2-${{ runner.os }}-${{ hashFiles('Optics/Grating_Physics/book/pyodide_assets.py', 'Optics/Grating_Physics/book/requirements-tested.txt') }}
      - uses: actions/cache@v4
        with:
          path: |
            Optics/Grating_Physics/_build/release/browser/native
            Optics/Grating_Physics/_build/release/browser/wasm-validation
          key: grating-browser-executed-v1-${{ runner.os }}-${{ steps.inputs.outputs.key }}
      - uses: actions/cache@v4
        with:
          path: |
            Optics/Grating_Physics/_build/public-pilot/_build/templates
            Optics/Grating_Physics/_build/public-pilot/_build/cache
            Optics/Grating_Physics/_build/release/browser/source/_build/templates
            Optics/Grating_Physics/_build/release/browser/source/_build/cache
          key: grating-renderer-v2-${{ runner.os }}-${{ hashFiles('Optics/Grating_Physics/book/requirements-tested.txt', '.github/workflows/grating-book.yml') }}
      - name: Build both editions and validate all browser computations
        run: python -B book/release.py build --wasm all
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grating-validation
          if-no-files-found: warn
          path: |
            Optics/Grating_Physics/_build/release/assembly.json
            Optics/Grating_Physics/_build/release/browser/checks.json
            Optics/Grating_Physics/_build/release/browser/wasm-validation/summary.json
            Optics/Grating_Physics/_build/release/browser/build.log
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Optics/Grating_Physics/_build/release/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          endpoint = (os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
                      + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts')
          request = urllib.request.Request(endpoint, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json'})
          for attempt in range(12):
              with urllib.request.urlopen(request, timeout=20) as response:
                  artifacts = json.load(response)['artifacts']
              if any(a['name'] == 'github-pages' and not a['expired'] for a in artifacts):
                  print('Pages artifact metadata is available.')
                  break
              print('Waiting for Pages artifact metadata...', flush=True)
              time.sleep(5)
          else:
              raise SystemExit('Uploaded Pages artifact is not visible yet; retry the workflow.')
          PY
      - name: Deploy Binder and browser Python editions
        id: deployment
        uses: actions/deploy-pages@v4
